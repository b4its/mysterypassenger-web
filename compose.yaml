name: v2mysterypassenger

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: mp_nginx
    restart: unless-stopped
    depends_on:
      php:
        condition: service_started
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [mp]

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: mp/php:8.4-node22
    container_name: mp_php
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      PHP_IDE_CONFIG: serverName=mp
    volumes:
      - ./:/var/www/html:cached
      - php_home:/home/www-data
    networks: [mp]

  mysql:
    image: mysql:8.4
    container_name: mp_mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-v2mysterypassenger}
      MYSQL_USER: ${DB_USERNAME:-mp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [mp]

  queue:
    image: mp/php:8.4-node22
    container_name: mp_queue
    restart: unless-stopped
    depends_on:
      php:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    volumes:
      - ./:/var/www/html:cached
      - php_home:/home/www-data
    command: php artisan queue:work --queue=default --tries=3 --timeout=900 --sleep=3 --max-jobs=500
    networks: [mp]

  scheduler:
    image: mp/php:8.4-node22
    container_name: mp_scheduler
    restart: unless-stopped
    depends_on:
      php:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    volumes:
      - ./:/var/www/html:cached
      - php_home:/home/www-data
    command: php artisan schedule:work
    networks: [mp]

  vite:
    image: mp/php:8.4-node22
    container_name: mp_vite
    profiles: ["dev"]
    depends_on:
      php:
        condition: service_started
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html:cached
      - php_home:/home/www-data
    command: npm run dev -- --host 0.0.0.0
    networks: [mp]

volumes:
  mysql_data:
  php_home:

networks:
  mp:
    driver: bridge
