server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 40M;      # selaras dengan post_max_size PHP

    # Header keamanan dasar
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Tolak akses ke direktori sensitif walaupun salah konfigurasi root
    location ~ ^/(storage/app|\.env|\.git) { deny all; return 404; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aset ter-build Vite
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param HTTPS           $http_x_forwarded_proto if_not_empty;

        fastcgi_hide_header X-Powered-By;

        # PDF/ZIP besar butuh waktu lebih lama
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        internal;
    }

    # Cegah eksekusi PHP di luar front controller
    location ~ \.php$ { return 404; }

    error_log  /dev/stderr warn;
    access_log /dev/stdout;
}
